[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "simddot"
version = "0.0.1"
requires-python = ">=3.12"

[tool.cibuildwheel]
build = ["cp312-*", "cp313-*"]
test-requires = ["pytest"]
test-command = "pytest {project}/tests"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "tomli-w>=1.2.0",
]
